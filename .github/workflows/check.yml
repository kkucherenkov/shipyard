name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-skills.sh
      - run: sh scripts/check-skills.test.sh
      - run: node skills/release-audit/auth-adapter.test.mjs
